<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #2b2b33;
        }

        .page {
            width: 88%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6657c8, #8a67d5);
            box-shadow: 0 8px 24px rgba(80, 67, 150, 0.18);
            margin-bottom: 35px;
        }

        .brand {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 24px;
            font-weight: 600;
            opacity: 0.9;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 34px;
        }

        .header p {
            margin: 0;
            color: #737382;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(30, 30, 50, 0.08);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .name-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #ddddea;
            font-size: 15px;
            outline: none;
        }

        .name-input:focus {
            border-color: #7a66d3;
            box-shadow: 0 0 0 3px rgba(122, 102, 211, 0.12);
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .skill-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f3f0ff;
            border: 1px solid #e3dcff;
            border-radius: 14px;
            padding: 13px 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .skill-box:hover {
            transform: translateY(-2px);
            background: #ece7ff;
        }

        .skill-box input {
            accent-color: #705bc7;
        }

        .submit-btn {
            background: #705bc7;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 26px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #5e49b2;
        }

        .message {
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #edf8f0;
            color: #346b42;
            border: 1px solid #cfe8d6;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="navbar">
        <div class="brand">
            SkillPath
        </div>

        <div class="nav-links">
            <a href="/">Recommendations</a>
            <a href="/users">Add User</a>
            <a href="/logs">History</a>
        </div>
    </div>

    <div class="header">
        <h1>Build Your Learning Profile</h1>
        <p>Select the skills and technologies you are interested in learning.</p>
    </div>

    <div class="card">

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-section">

                <div class="section-title">
                    Your Name
                </div>

                <input
                    class="name-input"
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-section">

                <div class="section-title">
                    Choose Your Skills
                </div>

                <div class="skills">

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="AI">
                        AI
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Artificial Intelligence">
                        Artificial Intelligence
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="AWS">
                        AWS
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Backend">
                        Backend
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="CSS">
                        CSS
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Data Analysis">
                        Data Analysis
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Database">
                        Database
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Data Science">
                        Data Science
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Deep Learning">
                        Deep Learning
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Django">
                        Django
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Docker">
                        Docker
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="FastAPI">
                        FastAPI
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Flask">
                        Flask
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Frontend">
                        Frontend
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Git">
                        Git
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Python">
                        Python
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="Machine Learning">
                        Machine Learning
                    </label>

                    <label class="skill-box">
                        <input type="checkbox" name="skills" value="SQL">
                        SQL
                    </label>

                </div>

            </div>

            <button class="submit-btn" type="submit">
                Create Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
